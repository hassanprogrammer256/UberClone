{% load static %}

<header class="uber-topbar">
    <a class="uber-brand" href="{% url 'index' %}" aria-label="Easy Rides home">
        <img class="uber-brand-logo" src="{% static 'images/logo.png' %}" alt="">
        <span>Easy Rides</span>
    </a>
  <nav class="home-main-nav" aria-label="Ride options">
        <a class="is-active" href="#ride-booking">Request A Lift</a>
        <a href="#driver-opportunity">Easy Driver</a>
    </nav>
    <nav class="uber-nav-actions" aria-label="Account navigation">
      
        {% if user.is_authenticated %}
            <a href="#account">{{ user.username }}</a>
        {% else %}
            <a href="{% url 'auth' %}">Sign in</a>
        {% endif %}
    </nav>
</header>
