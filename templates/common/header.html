{% load static %}

<header class="uber-topbar">
    <a class="uber-brand" href="{% url 'index' %}" aria-label="Uber home">UBER</a>
    <nav class="uber-nav" aria-label="Main navigation">
        <a href="{% url 'index' %}" {% if request.path == '/' %}aria-current="page"{% endif %}>Ride</a>
        <a href="{% url 'register' %}">Drive</a>
        <a href="#business">Business</a>
    </nav>
    <nav class="uber-nav-actions" aria-label="Account navigation">
        <a href="#help">Help</a>
        {% if user.is_authenticated %}
            <a href="#account">{{ user.username }}</a>
        {% else %}
            <a href="{% url 'login' %}">Sign in</a>
        {% endif %}
    </nav>
</header>
